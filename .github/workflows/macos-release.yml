name: macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package-preview:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate
        working-directory: macos

      - name: Test
        run: |
          xcodebuild test \
            -scheme CodexRateLimitTrayMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
        working-directory: macos

      - name: Build unsigned app
        run: |
          xcodebuild \
            -scheme CodexRateLimitTrayMac \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath ../artifacts/macos/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
        working-directory: macos

      - name: Package DMG and ZIP
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="0.1.0-preview.${GITHUB_RUN_NUMBER}"
          fi
          APP_PATH="$PWD/artifacts/macos/DerivedData/Build/Products/Release/CodexRateLimitTray.app"
          test -d "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          APP_PATH="$APP_PATH" VERSION="$VERSION" OUTPUT_DIR="$PWD/artifacts/macos" macos/Scripts/package-dmg.sh
          APP_PATH="$APP_PATH" VERSION="$VERSION" OUTPUT_DIR="$PWD/artifacts/macos" macos/Scripts/package-zip.sh

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('preview-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Preview {0}', github.run_number) }}
          files: |
            artifacts/macos/*.dmg
            artifacts/macos/*.zip
            artifacts/macos/*.sha256
