name: macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate
        working-directory: macos

      - name: Test
        run: xcodebuild test -scheme CodexRateLimitTrayMac -destination 'platform=macOS'
        working-directory: macos

      - name: Archive
        run: |
          xcodebuild -scheme CodexRateLimitTrayMac \
            -configuration Release \
            -destination 'platform=macOS' \
            archive \
            -archivePath ../artifacts/macos/CodexRateLimitTray.xcarchive
        working-directory: macos

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-xcarchive
          path: artifacts/macos/CodexRateLimitTray.xcarchive

  notarize-package:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: macos-xcarchive
          path: artifacts/macos/CodexRateLimitTray.xcarchive

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        run: |
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" build.keychain

      - name: Export signed app
        run: |
          mkdir -p artifacts/macos/export
          cp -R artifacts/macos/CodexRateLimitTray.xcarchive/Products/Applications/CodexRateLimitTray.app artifacts/macos/export/
          codesign --force --deep --options runtime --timestamp --sign "Developer ID Application" artifacts/macos/export/CodexRateLimitTray.app

      - name: Package DMG and ZIP
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          APP_PATH="$PWD/artifacts/macos/export/CodexRateLimitTray.app" VERSION="$VERSION" OUTPUT_DIR="$PWD/artifacts/macos" macos/Scripts/package-dmg.sh
          APP_PATH="$PWD/artifacts/macos/export/CodexRateLimitTray.app" VERSION="$VERSION" OUTPUT_DIR="$PWD/artifacts/macos" macos/Scripts/package-zip.sh

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          macos/Scripts/notarize.sh "artifacts/macos/CodexRateLimitTray-${VERSION}-macos-universal.dmg"

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          VERSION="$VERSION" \
          SPARKLE_PRIVATE_KEY="$SPARKLE_PRIVATE_KEY" \
          RELEASE_BASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}" \
          ARCHIVE_PATH="$PWD/artifacts/macos/CodexRateLimitTray-${VERSION}-macos-universal.zip" \
          OUTPUT_DIR="$PWD/artifacts/macos" \
          macos/Scripts/generate-appcast.sh

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos/*.dmg
            artifacts/macos/*.zip
            artifacts/macos/appcast.xml
            artifacts/macos/*.sha256
